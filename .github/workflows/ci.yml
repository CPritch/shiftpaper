name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # Build with load-dynamic to avoid downloading libonnxruntime (~200 MB)
      # during CI. The runtime library is not needed for type-checking.
      - name: cargo check
        run: |
          cargo check -p shiftpaper-cli --no-default-features --features load-dynamic
          cargo check -p shiftpaper-daemon

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: |
          cargo clippy -p shiftpaper-config --all-targets --all-features -- -D warnings
          cargo clippy -p shiftpaper-cli --all-targets --no-default-features --features load-dynamic -- -D warnings
          cargo clippy -p shiftpaper-daemon --all-targets -- -D warnings

      - name: cargo test
        run: |
          cargo test -p shiftpaper-config --all-features
          cargo test -p shiftpaper-cli --no-default-features --features load-dynamic
          cargo test -p shiftpaper-daemon
