name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'
  # Publish an existing release to the AUR again, without rebuilding it.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the AUR, e.g. v0.3.0
        required: true

jobs:
  build:
    name: Build release binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # The CLI uses the default ORT_STRATEGY=download. ort-sys fetches
      # libonnxruntime at build time and links it statically, producing a
      # self-contained binary that doesn't need onnxruntime installed.
      - name: Build CLI (with ONNX Runtime bundled)
        run: cargo build --release --locked --package shiftpaper-cli

      - name: Build daemon
        run: cargo build --release --locked --package shiftpaper-daemon

      - name: Package binaries
        run: |
          mkdir -p dist
          tar -czf dist/shiftpaper-${{ github.ref_name }}-x86_64-linux.tar.gz \
            -C target/release shiftpaper shiftpaperd
          cp shiftpaperd.service dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shiftpaper-${{ github.ref_name }}-x86_64-linux.tar.gz
            dist/shiftpaperd.service
          generate_release_notes: true
          body: |
            ## Installation

            ### Arch Linux
            ```bash
            paru -S shiftpaper
            ```

            ### From tarball
            The systemd unit runs `shiftpaperd` by name, and systemd only
            looks in /usr/local/bin and /usr/bin, so install there.
            ```bash
            tar -xzf shiftpaper-${{ github.ref_name }}-x86_64-linux.tar.gz
            sudo install -Dm755 shiftpaper  /usr/local/bin/shiftpaper
            sudo install -Dm755 shiftpaperd /usr/local/bin/shiftpaperd
            install -Dm644 shiftpaperd.service ~/.config/systemd/user/shiftpaperd.service
            systemctl --user daemon-reload
            ```

            ### Quick start
            ```bash
            shiftpaper fetch-model          # download the default depth model
            shiftpaper set ~/Pictures/wallpaper.jpg
            systemctl --user enable --now shiftpaperd
            ```

  aur:
    name: Publish to the AUR
    needs: build
    # Runs after a successful build, or on its own when build is skipped
    # for a manual run.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash

    steps:
      # Without git, actions/checkout downloads GitHub's tarball instead,
      # which leaves out packaging/ (it's export-ignore), so install it first.
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # makepkg refuses to run as root, so builds happen as this user.
      - name: Set up a build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          cp -r packaging/aur/shiftpaper /home/builder/pkg
          chown -R builder: /home/builder/pkg

      - name: Point the PKGBUILD at this release
        working-directory: /home/builder/pkg
        run: |
          sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sudo -u builder updpkgsums
          sudo -u builder sh -c 'makepkg --printsrcinfo > .SRCINFO'

      # Never publish a PKGBUILD that doesn't build and pass its tests.
      - name: Test-build the package
        working-directory: /home/builder/pkg
        run: sudo -u builder makepkg --syncdeps --noconfirm

      - name: Push to the AUR
        working-directory: /home/builder/pkg
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          # ssh ignores $HOME in this container, so give it explicit paths.
          keys=$(mktemp -d)
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$keys/aur"
          chmod 600 "$keys/aur"
          # Pinned host key. Its fingerprint, SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4,
          # matches the one published on aur.archlinux.org.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$keys/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $keys/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$keys/known_hosts -o StrictHostKeyChecking=yes"

          git clone ssh://aur@aur.archlinux.org/shiftpaper.git aur
          cp PKGBUILD .SRCINFO aur/
          cd aur
          git config user.name "Charles Pritchard"
          git config user.email "charlespritchard.work@gmail.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR already has this version."
          else
            git commit -m "Update to ${TAG#v}"
            git push origin master
          fi

