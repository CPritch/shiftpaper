[workspace]
resolver = "3"
members = ["crates/config", "crates/render", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.4.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/CPritch/shiftpaper"
homepage = "https://github.com/CPritch/shiftpaper"

[workspace.dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
shiftpaper-config = { path = "crates/config" }
shiftpaper-render = { path = "crates/render" }
wgpu = "30"
