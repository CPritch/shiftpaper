[package]
name = "shiftpaper-cli"
description = "Shiftpaper CLI: bake wallpapers and configure the daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shiftpaper"
path = "src/main.rs"

[features]
default = ["cuda"]
cuda = ["ort/cuda"]
load-dynamic = ["ort/load-dynamic"]

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

image = { workspace = true, features = ["jpeg", "png", "webp"] }

shiftpaper-config = { workspace = true, features = ["clap"] }

ort = { version = "=2.0.0-rc.12" }
blake3 = "1"

clap = { version = "4", features = ["derive", "env"] }
toml_edit = "0.22"
directories = "5"
ureq = "3"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3"
