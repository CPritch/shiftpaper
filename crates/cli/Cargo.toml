[package]
name = "shiftpaper-cli"
description = "Shiftpaper CLI: bake wallpapers and configure the daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shiftpaper"
path = "src/main.rs"

[features]
default = ["cuda"]
cuda = ["ort/cuda"]
load-dynamic = ["ort/load-dynamic", "dep:libloading"]

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

image = { workspace = true, features = ["jpeg", "png", "webp"] }

shiftpaper-config = { workspace = true, features = ["clap"] }

ort = { version = "=2.0.0-rc.12" }
# Only used to check libonnxruntime loads before ort tries (see depth.rs).
libloading = { version = "0.9", optional = true }
blake3 = "1"

clap = { version = "4", features = ["derive", "env", "wrap_help"] }
toml_edit = "0.25"
directories = "6"
ureq = "3"
indicatif = "0.18"
# Signals a running shiftpaperd to reload, after a change to the config.
nix = { version = "0.31", features = ["signal"] }

[dev-dependencies]
tempfile = "3"
