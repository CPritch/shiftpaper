[package]
name = "shiftpaper-daemon"
description = "Parallax wallpaper daemon for Wayland"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shiftpaperd"
path = "src/main.rs"

[dependencies]
# No keyboard handling is needed, so skip the default xkbcommon feature,
# which would require libxkbcommon at build time.
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-backend = { version = "0.3", features = ["client_system"] }

wgpu = { workspace = true }
raw-window-handle = "0.6"

shiftpaper-config = { workspace = true }
shiftpaper-render = { workspace = true }

calloop = "0.14"
calloop-wayland-source = "0.4"

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

anyhow = { workspace = true }
nix = { version = "0.31", features = ["signal"] }
pollster = "1"
# Only for --help and --version, which would otherwise start the daemon.
clap = { version = "4", features = ["derive", "wrap_help"] }

[dev-dependencies]
shiftpaper-config = { workspace = true, features = ["man"] }
