[package]
name = "shiftpaper-daemon"
description = "Parallax wallpaper daemon for Wayland"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shiftpaperd"
path = "src/main.rs"

[dependencies]
# No keyboard handling is needed, so skip the default xkbcommon feature,
# which would require libxkbcommon at build time.
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-backend = { version = "0.3", features = ["client_system"] }

wgpu = "30"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }

image = { workspace = true, features = ["png"] }

shiftpaper-config = { workspace = true }

calloop = "0.14"
calloop-wayland-source = "0.4"

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

anyhow = { workspace = true }
nix = { version = "0.31", features = ["signal"] }
pollster = "1"

[dev-dependencies]
# Same version wgpu uses internally, to validate shader.wgsl in tests.
naga = { version = "30", features = ["wgsl-in"] }
